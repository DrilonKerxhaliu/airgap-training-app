# ===============================
# Server
# ===============================
server.port=8080
spring.application.name=airgap-service

# ===============================
# JSON only via Gson
# ===============================
spring.mvc.converters.preferred-json-mapper=gson

# ===============================
# Datasource (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/airgap_db
spring.datasource.username=airgap_user
spring.datasource.password=airgap_pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect

# ===============================
# Airgap Paths (use @Value in code)
# ===============================
airgap.collect.in=/COLLECTED_DATA/IN
airgap.collect.out=/COLLECTED_DATA/OUT

# Output folder for generated packages
airgap.packages.dir=/COLLECTED_DATA/PACKAGES

# ===============================
# AUTO packaging (Quartz)
# ===============================
airgap.auto.hours=1
airgap.auto.max-gb=100

# ===============================
# Cleanup (Quartz)
# ===============================
airgap.cleanup.days=10

# ===============================
# Crypto
# AES-256 key (Base64) -> 32 bytes when decoded
# ===============================
airgap.crypto.aes256.key.base64=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# ===============================
# Incoming packages inbox (folder-watcher)
# ===============================
airgap.incoming.packages.dir=/COLLECTED_DATA/IN_PACKAGES
